name: Build custom Chatwoot image

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: chatwoot-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/unialgo/unialgo-chat

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:unialgo
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger UniAlgo Dokploy redeploy
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.UNIALGO_DOKPLOY_COMPOSE_ID }}
        run: |
          test -n "$DOKPLOY_URL"
          test -n "$DOKPLOY_API_KEY"
          test -n "$DOKPLOY_COMPOSE_ID"
          npx -y @dokploy/cli compose deploy \
            --composeId "$DOKPLOY_COMPOSE_ID" \
            --title "Deploy custom Chatwoot image" \
            --description "Image: $IMAGE_NAME:$GITHUB_SHA" \
            --json
